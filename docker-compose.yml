services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eisd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eisd_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-eisd_one}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eisd} -d ${POSTGRES_DB:-eisd_one}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-eisd}:${POSTGRES_PASSWORD:-eisd_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-eisd_one}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-eisd}:${POSTGRES_PASSWORD:-eisd_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-eisd_one}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev_only_jwt_secret_replace_in_production_32chars}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
      AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-}
      UPLOAD_DIR: /app/uploads
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AdminEisd123!}
    ports:
      - '3000:3000'
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads_data:
